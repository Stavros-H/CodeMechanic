<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- CodeMechanic Logo - Wrench made of code symbols -->
  
  <!-- CODE text -->
  <text x="10" y="25" font-size="20" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">Code.</text>
  
  <!-- MECHANIC text -->
  <text x="10" y="85" font-size="20" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">Mechanic</text>
  
  <!-- Wrench made of code symbols -->
  
  <!-- Top jaw: {------} -->
  <text x="150" y="25" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">{</text>
  <text x="160" y="25" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">------</text>
  <text x="210" y="25" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">}</text>
  
  <!-- Handle: |||||| -->
  <text x="150" y="45" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">||||||</text>
  
  <!-- Bottom jaw: [______] -->
  <text x="150" y="75" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">[</text>
  <text x="160" y="75" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">______</text>
  <text x="210" y="75" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">]</text>
  
  <!-- Connecting piece: /\ -->
  <text x="145" y="50" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">/</text>
  <text x="215" y="50" font-size="24" font-family="'Courier New', monospace" fill="#bd91ff" font-weight="bold">\</text>
</svg>
