<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-labelledby="title desc">
  <title id="title">CodeMechanic</title>
  <desc id="desc">A precision wrench formed from code brackets, beside the CodeMechanic wordmark.</desc>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Paired code braces form the open wrench head. -->
    <path d="M27 7.5c-5.5 0-7.5 3.1-7.5 8v3c0 3.7-1.7 6.2-5.5 7.5 3.8 1.3 5.5 3.8 5.5 7.5v3c0 4.9 2 8 7.5 8"
      stroke="#d8c0ff" stroke-width="4"/>
    <path d="M35 7.5c5.5 0 7.5 3.1 7.5 8v3c0 3.7 1.7 6.2 5.5 7.5-3.8 1.3-5.5 3.8-5.5 7.5v3c0 4.9-2 8-7.5 8"
      stroke="#bd91ff" stroke-width="4"/>
    <!-- Double slash / pipe strokes make a clear coded handle. -->
    <path d="m34 34-18.5 18.5m25-15.5L22 55.5" stroke="#bd91ff" stroke-width="4.5"/>
    <path d="m16 47.5 4.5 4.5m16-16 4.5 4.5" stroke="#f3effa" stroke-width="1.8"/>
  </g>
  <circle cx="31" cy="26" r="2" fill="#9fe2c1"/>

  <text x="76" y="30" fill="#f3effa" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.8">Code<tspan fill="#bd91ff">.</tspan></text>
  <text x="77" y="50" fill="#c9c0d8" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.8">Mechanic</text>
</svg>
