<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-labelledby="title desc">
  <title id="title">CodeMechanic</title>
  <desc id="desc">The stacked CodeMechanic wordmark joined to an open-end wrench.</desc>

  <!-- The straight handle runs through the wordmark gap and joins the head at its back. -->
  <path d="M87 32h151" fill="none" stroke="#bd91ff" stroke-width="5" stroke-linecap="square"/>

  <!-- A single clear open-end head: two jaws frame the open mouth on the right. -->
  <path d="M224 18h11V8c11-4 25 1 25 13l-17 4v6l17 4c-4 12-15 18-25 12V36h-11Z"
    fill="#bd91ff" stroke="#d8c0ff" stroke-width="1.2" stroke-linejoin="round"/>

  <text x="5" y="23" fill="#f3effa" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.7">Code<tspan fill="#bd91ff">.</tspan></text>
  <text x="5" y="57" fill="#c9c0d8" font-family="DM Sans, sans-serif" font-size="17" font-weight="600" letter-spacing="0.25">Mechanic</text>
</svg>
