<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-labelledby="title desc">
  <title id="title">CodeMechanic</title>
  <desc id="desc">A precision wrench formed from code brackets, beside the CodeMechanic wordmark.</desc>

  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Paired curly braces make the wrench head, notches open toward the handle. -->
    <path d="M25 5.5c-4.4 0-6.2 2.3-6.2 6.4v2.3c0 3-1.3 4.9-4.4 5.9 3.1 1 4.4 2.9 4.4 5.9v2.3c0 4.1 1.8 6.4 6.2 6.4"
      stroke="#d8c0ff" stroke-width="3.5"/>
    <path d="M32 5.5c4.4 0 6.2 2.3 6.2 6.4v2.3c0 3 1.3 4.9 4.4 5.9-3.1 1-4.4 2.9-4.4 5.9v2.3c0 4.1-1.8 6.4-6.2 6.4"
      stroke="#bd91ff" stroke-width="3.5"/>
    <!-- The slash hands off to a literal code token in the wordmark gap. -->
    <path d="m34 28 5.5 7" stroke="#bd91ff" stroke-width="3"/>
  </g>
  <circle cx="29" cy="20" r="1.8" fill="#9fe2c1"/>
  <text x="39" y="39" fill="#d8c0ff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="-1.1">&lt;/&gt;</text>

  <text x="66" y="23" fill="#f3effa" font-family="DM Sans, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.7">Code<tspan fill="#bd91ff">.</tspan></text>
  <text x="66" y="57" fill="#c9c0d8" font-family="DM Sans, sans-serif" font-size="17" font-weight="600" letter-spacing="0.25">Mechanic</text>
</svg>
